<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子票券管理</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 0; padding: 0; }
    .header { background-color: #f39c12; color: white; padding: 15px; text-align: center; font-size: 1.2em; font-weight: bold; }
    .controls-container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: flex; gap: 10px; }
    #location-filter { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; outline: none; }
    .btn-add { background-color: #2980b9; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    #ticket-container { max-width: 1200px; margin: 0 auto; padding: 0 15px 30px 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    
    /* 卡片設計 */
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .ticket-title { font-size: 1.1em; font-weight: bold; color: #333; margin: 0; flex: 1; padding-right: 10px; }
    .brand-tag { background: #7f8c8d; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold; white-space: nowrap; }
    .expire { color: #7f8c8d; font-size: 0.9em; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
    .code-box { display: none; margin: 15px 0; text-align: center; }
    .code-box.show { display: flex; flex-direction: column; align-items: center; }
    .qr-container { display: flex; justify-content: center; margin-bottom: 10px; }
    svg { max-width: 100%; height: auto; }
    .btn-outline-blue { background: white; color: #2980b9; border: 1px solid #2980b9; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 10px; font-weight: bold; transition: 0.2s; }
    .btn-outline-green { background: white; color: #27ae60; border: 1px solid #27ae60; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s; }
    
    /* 新增彈出視窗 (Modal) 設計 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
    .modal h3 { margin: 0; color: #333; text-align: center; }
    .modal input, .modal select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; width: 100%; box-sizing: border-box; }
    .modal-btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn-submit { flex: 1; background: #27ae60; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-cancel { flex: 1; background: #95a5a6; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  
  <div class="header">🎫 電子票券管理</div>

  <div class="controls-container">
    <select id="location-filter" onchange="filterTickets()">
      <option value="all">顯示全部地點</option>
    </select>
    <button class="btn-add" onclick="openModal()">+ 新增</button>
  </div>

  <div id="ticket-container">
    <p style="text-align: center; color: #666; grid-column: 1 / -1;">讀取票券中，請稍候...</p>
  </div>

  <!-- 新增票券視窗 -->
  <div id="addModal" class="modal-overlay">
    <div class="modal">
      <h3>➕ 新增票券</h3>
      <input type="text" id="input-brand" placeholder="品牌 (例：麥當勞)">
      <input type="text" id="input-item" placeholder="兌換品項 (例：大麥克)">
      <input type="text" id="input-barcode" placeholder="條碼數字 或 QR網址">
      <input type="date" id="input-expire">
      <select id="input-type">
        <option value="1D">一般條碼 (1D)</option>
        <option value="QR">QR Code</option>
      </select>
      <div class="modal-btn-group">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-submit" onclick="submitTicket()" id="btn-submit">確認新增</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️【請替換為你最新部署的 GAS 網址】
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzxGehuREJblWe8VY-JgGgN5mNhGG1GnXp2Y3-2rXuS0TvSDMJLvVm4mTef9o_J__Ix/exec';
    let allTicketsData = [];

    async function fetchTickets() {
      try {
        const res = await fetch(GAS_URL);
        allTicketsData = await res.json();
        setupFilter(allTicketsData);
        renderTickets(allTicketsData);
      } catch (error) {
        document.getElementById('ticket-container').innerHTML = '<p style="text-align:center; color:red; grid-column: 1/-1;">讀取失敗，請重新整理網頁。</p>';
      }
    }

    function setupFilter(tickets) {
      const filterSelect = document.getElementById('location-filter');
      const currentSelection = filterSelect.value;
      filterSelect.innerHTML = '<option value="all">顯示全部地點</option>';
      const brands = [...new Set(tickets.map(t => t.brand))].filter(b => b);
      
      brands.forEach(brand => {
        const option = document.createElement('option');
        option.value = brand;
        option.textContent = brand;
        filterSelect.appendChild(option);
      });
      filterSelect.value = currentSelection === 'all' ? 'all' : (brands.includes(currentSelection) ? currentSelection : 'all');
    }

    function filterTickets() {
      const selectedBrand = document.getElementById('location-filter').value;
      renderTickets(selectedBrand === 'all' ? allTicketsData : allTicketsData.filter(t => t.brand === selectedBrand));
    }

    function renderTickets(tickets) {
      const container = document.getElementById('ticket-container');
      container.innerHTML = '';
      if(tickets.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#666; grid-column: 1/-1;">目前沒有可用的票券囉！</p>';
        return;
      }
      tickets.forEach(ticket => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `ticket-${ticket.row}`;
        
        const codeContainer = ticket.type === 'QR' 
          ? `<div id="qr-${ticket.row}" class="qr-container"></div>`
          : `<svg id="barcode-${ticket.row}"></svg>`;
        
        // 更新顯示邏輯：標題顯示「兌換品項」
        card.innerHTML = `
          <div class="card-header">
            <h3 class="ticket-title">${ticket.item}</h3>
            <span class="brand-tag">${ticket.brand}</span>
          </div>
          <div class="expire">📅 到期日：${ticket.expireDate}</div>
          
          <button class="btn-outline-blue" onclick="toggleBarcode(${ticket.row}, '${String(ticket.barcode)}', '${ticket.type}')">👀 點我顯示條碼結帳</button>
          
          <div id="code-box-${ticket.row}" class="code-box">
            ${codeContainer}
          </div>
          
          <button class="btn-outline-green" onclick="useTicket(${ticket.row})">✅ 結帳完成，標記為已使用</button>
        `;
        container.appendChild(card);
      });
    }

    function toggleBarcode(rowNum, barcodeValue, type) {
      const box = document.getElementById(`code-box-${rowNum}`);
      if (box.classList.contains('show')) {
        box.classList.remove('show');
      } else {
        box.classList.add('show');
        if (!box.dataset.rendered) {
          if (type === 'QR') {
            new QRCode(document.getElementById(`qr-${rowNum}`), { text: barcodeValue, width: 150, height: 150 });
          } else {
            JsBarcode(`#barcode-${rowNum}`, barcodeValue, { format: "CODE128", width: 2, height: 70, displayValue: true, fontSize: 16 });
          }
          box.dataset.rendered = "true";
        }
      }
    }

    // 處理核銷 (action: 'use')
    async function useTicket(rowNum) {
      if(!confirm('結帳刷完條碼了嗎？確定要核銷？')) return;
      const btn = document.querySelector(`#ticket-${rowNum} .btn-outline-green`);
      btn.disabled = true;
      btn.innerText = '處理中...';

      await fetch(GAS_URL, {
        method: 'POST',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: 'use', row: rowNum })
      });

      document.getElementById(`ticket-${rowNum}`).style.display = 'none';
      allTicketsData = allTicketsData.filter(t => t.row !== rowNum);
    }

    // Modal 開關邏輯
    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { 
      document.getElementById('addModal').style.display = 'none'; 
      document.getElementById('input-brand').value = '';
      document.getElementById('input-item').value = '';
      document.getElementById('input-barcode').value = '';
      document.getElementById('input-expire').value = '';
    }

    // 處理新增 (action: 'add')
    async function submitTicket() {
      const brand = document.getElementById('input-brand').value.trim();
      const item = document.getElementById('input-item').value.trim();
      const barcode = document.getElementById('input-barcode').value.trim();
      const expireDate = document.getElementById('input-expire').value;
      const type = document.getElementById('input-type').value;

      if(!brand || !item || !barcode || !expireDate) {
        alert('請將所有欄位填寫完整！');
        return;
      }

      const submitBtn = document.getElementById('btn-submit');
      submitBtn.disabled = true;
      submitBtn.innerText = '寫入中...';

      const payload = {
        action: 'add',
        brand: brand,
        item: item,
        barcode: barcode,
        expireDate: expireDate.replace(/-/g, '/'), // 確保日期格式一致
        type: type
      };

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        
        alert('新增成功！');
        closeModal();
        // 重新讀取資料以顯示新票券
        document.getElementById('ticket-container').innerHTML = '<p style="text-align: center; color: #666; grid-column: 1 / -1;">重新整理票券中...</p>';
        fetchTickets();
      } catch (e) {
        alert('新增失敗，請檢查網路連線。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '確認新增';
      }
    }

    fetchTickets();
  </script>
</body>
</html>
