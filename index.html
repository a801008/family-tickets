<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子票券管理</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 0; padding: 0; }
    .header { background-color: #f39c12; color: white; padding: 15px; text-align: center; font-size: 1.2em; font-weight: bold; }
    
    .controls-container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: flex; gap: 10px; }
    #location-filter { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; outline: none; }
    .btn-add { background-color: #2980b9; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; }
    .btn-ai { background-color: #8e44ad; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap; }
    
    #ticket-container { max-width: 1200px; margin: 0 auto; padding: 0 15px 30px 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .ticket-title { font-size: 1.1em; font-weight: bold; color: #333; margin: 0; flex: 1; padding-right: 10px; }
    .brand-tag { background: #7f8c8d; color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold; white-space: nowrap; }
    
    .expire { color: #7f8c8d; font-size: 0.9em; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
    .expire-soon { color: #e74c3c; font-weight: bold; font-size: 1em; background: #fadbd8; padding: 4px 8px; border-radius: 6px; display: inline-flex; }
    
    .code-box { display: none; margin: 15px 0; text-align: center; }
    .code-box.show { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .qr-container { display: flex; justify-content: center; padding: 10px; border: 1px dashed #ccc; border-radius: 8px; background: #fff; }
    .barcodes-container { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    svg { max-width: 100%; height: auto; }
    
    .btn-outline-blue { background: white; color: #2980b9; border: 1px solid #2980b9; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 10px; font-weight: bold; transition: 0.2s; }
    .btn-outline-green { background: white; color: #27ae60; border: 1px solid #27ae60; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s; }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
    .modal h3 { margin: 0; color: #333; text-align: center; }
    .modal input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; width: 100%; box-sizing: border-box; }
    .modal-btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn-submit { flex: 1; background: #27ae60; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-cancel { flex: 1; background: #95a5a6; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* AI 載入動畫專屬樣式 */
    .ai-loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; color: white; font-size: 1.2em; font-weight: bold; }
    .spinner { border: 6px solid rgba(255,255,255,0.3); border-top: 6px solid #8e44ad; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  
  <div class="header">🎫 電子票券管理</div>

  <div class="controls-container">
    <select id="location-filter" onchange="filterTickets()">
      <option value="all">顯示全部地點</option>
    </select>
    
    <!-- 隱藏的上傳元件與觸發按鈕 -->
    <input type="file" id="ai-upload" accept="image/*" style="display: none;" onchange="processAIImage(event)">
    <button class="btn-ai" onclick="document.getElementById('ai-upload').click()">📸 AI 辨識</button>
    <button class="btn-add" onclick="openModal()">+ 手動</button>
  </div>

  <div id="ticket-container">
    <p id="loading-text" style="text-align: center; color: #666; grid-column: 1 / -1;">正在同步最新資料中...</p>
  </div>

  <!-- 新增票券視窗 -->
  <div id="addModal" class="modal-overlay">
    <div class="modal">
      <h3 id="modal-title">➕ 新增票券</h3>
      <input type="text" id="input-brand" placeholder="品牌 (例：萊爾富)">
      <input type="text" id="input-item" placeholder="兌換品項 (例：統一布丁)">
      <input type="text" id="input-barcode" placeholder="多條碼請用逗號分隔">
      <input type="date" id="input-expire">
      <div class="modal-btn-group">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-submit" onclick="submitTicket()" id="btn-submit">確認新增</button>
      </div>
    </div>
  </div>

  <!-- AI 讀取中的全螢幕覆蓋層 -->
  <div id="ai-loading" class="ai-loading-overlay">
    <div class="spinner"></div>
    <div>AI 正在努力看懂票券...</div>
    <div style="font-size: 0.8em; margin-top: 10px; color: #ccc;">(通常需要 5~10 秒，請稍候)</div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzxGehuREJblWe8VY-JgGgN5mNhGG1GnXp2Y3-2rXuS0TvSDMJLvVm4mTef9o_J__Ix/exec';
    let allTicketsData = [];

    async function fetchTickets() {
      const cachedData = localStorage.getItem('familyTicketsData');
      if (cachedData) {
        allTicketsData = JSON.parse(cachedData);
        setupFilter(allTicketsData);
        renderTickets(allTicketsData);
        document.getElementById('loading-text') && document.getElementById('loading-text').remove();
      }

      try {
        const res = await fetch(GAS_URL + "?t=" + new Date().getTime());
        const freshData = await res.json();
        
        if (JSON.stringify(freshData) !== JSON.stringify(allTicketsData)) {
          allTicketsData = freshData;
          localStorage.setItem('familyTicketsData', JSON.stringify(freshData));
          setupFilter(allTicketsData);
          renderTickets(allTicketsData);
        }
      } catch (error) {
        if (!cachedData) {
          document.getElementById('ticket-container').innerHTML = '<p style="text-align:center; color:red; grid-column: 1/-1;">讀取失敗，請檢查網路狀態。</p>';
        }
      }
    }

    function setupFilter(tickets) {
      const filterSelect = document.getElementById('location-filter');
      const currentSelection = filterSelect.value;
      filterSelect.innerHTML = '<option value="all">顯示全部地點</option>';
      const brands = [...new Set(tickets.map(t => t.brand))].filter(b => b);
      
      brands.forEach(brand => {
        const option = document.createElement('option');
        option.value = brand;
        option.textContent = brand;
        filterSelect.appendChild(option);
      });
      filterSelect.value = currentSelection === 'all' ? 'all' : (brands.includes(currentSelection) ? currentSelection : 'all');
    }

    function filterTickets() {
      const selectedBrand = document.getElementById('location-filter').value;
      renderTickets(selectedBrand === 'all' ? allTicketsData : allTicketsData.filter(t => t.brand === selectedBrand));
    }

    function renderTickets(tickets) {
      const container = document.getElementById('ticket-container');
      container.innerHTML = '';
      if(tickets.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#666; grid-column: 1/-1;">目前沒有可用的票券囉！</p>';
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      tickets.forEach(ticket => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `ticket-${ticket.row}`;
        
        const expDate = new Date(ticket.expireDate);
        const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
        const isExpiringSoon = diffDays >= 0 && diffDays <= 7;
        
        const expireHtml = isExpiringSoon 
          ? `<div class="expire expire-soon">⚠️ 剩餘 ${diffDays} 天！到期日：${ticket.expireDate}</div>`
          : `<div class="expire">📅 到期日：${ticket.expireDate}</div>`;

        card.innerHTML = `
          <div class="card-header">
            <h3 class="ticket-title">${ticket.item}</h3>
            <span class="brand-tag">${ticket.brand}</span>
          </div>
          ${expireHtml}
          
          <button class="btn-outline-blue" onclick="toggleBarcode(${ticket.row}, '${String(ticket.barcode)}')">👀 點我顯示條碼結帳</button>
          
          <div id="code-box-${ticket.row}" class="code-box">
            <div id="qr-${ticket.row}" class="qr-container"></div>
            <div id="barcodes-${ticket.row}" class="barcodes-container"></div>
          </div>
          
          <button class="btn-outline-green" onclick="useTicket(${ticket.row})">✅ 結帳完成，標記為已使用</button>
        `;
        container.appendChild(card);
      });
    }

    function toggleBarcode(rowNum, barcodeValue) {
      const box = document.getElementById(`code-box-${rowNum}`);
      if (box.classList.contains('show')) {
        box.classList.remove('show');
      } else {
        box.classList.add('show');
        if (!box.dataset.rendered) {
          
          const codes = String(barcodeValue).split(',');
          
          new QRCode(document.getElementById(`qr-${rowNum}`), { 
            text: codes[0].trim(), width: 130, height: 130 
          });
          
          const barcodeContainer = document.getElementById(`barcodes-${rowNum}`);
          codes.forEach((code, index) => {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.id = `svg-${rowNum}-${index}`;
            barcodeContainer.appendChild(svg);
            
            JsBarcode(`#svg-${rowNum}-${index}`, code.trim(), { 
              format: "CODE128", width: 2, height: 60, displayValue: true, fontSize: 16 
            });
          });

          box.dataset.rendered = "true";
        }
      }
    }

    async function useTicket(rowNum) {
      if(!confirm('結帳刷完條碼了嗎？確定要核銷？')) return;
      const btn = document.querySelector(`#ticket-${rowNum} .btn-outline-green`);
      btn.disabled = true;
      btn.innerText = '處理中...';

      document.getElementById(`ticket-${rowNum}`).style.display = 'none';
      allTicketsData = allTicketsData.filter(t => t.row !== rowNum);
      localStorage.setItem('familyTicketsData', JSON.stringify(allTicketsData));

      await fetch(GAS_URL, {
        method: 'POST',
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: 'use', row: rowNum })
      });
    }

    function openModal() { 
      document.getElementById('modal-title').innerText = '➕ 新增票券';
      document.getElementById('addModal').style.display = 'flex'; 
    }
    
    function closeModal() { 
      document.getElementById('addModal').style.display = 'none'; 
      document.getElementById('input-brand').value = '';
      document.getElementById('input-item').value = '';
      document.getElementById('input-barcode').value = '';
      document.getElementById('input-expire').value = '';
    }

    // 🌟 AI 圖片處理核心邏輯
    async function processAIImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('ai-loading').style.display = 'flex';
      const reader = new FileReader();
      
      reader.onload = async function(e) {
        const base64Image = e.target.result;

        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: 'recognize',
              image
